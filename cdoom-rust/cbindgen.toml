language = "C"
include_guard = "CDOOM_RUST_H"
autogen_warning = "/* Generated by cbindgen — do not edit. */"
documentation = true
usize_is_size_t = true

[export]
prefix = "cdoom_rust_"

[export.rename]
"cdoom_rust_fixed_div" = "cdoom_rust_fixed_div"
"cdoom_rust_fixed_mul" = "cdoom_rust_fixed_mul"
"cdoom_rust_m_add_to_box" = "cdoom_rust_m_add_to_box"
"cdoom_rust_m_clear_box" = "cdoom_rust_m_clear_box"
"cdoom_rust_version" = "cdoom_rust_version"

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
