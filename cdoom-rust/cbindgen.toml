language = "C"
include_guard = "CDOOM_RUST_H"
autogen_warning = "/* Generated by cbindgen — do not edit. */"
documentation = true
usize_is_size_t = true
trailer = """
#ifndef CDOOM_RUST_TABLE_ABI_DECLS
#define CDOOM_RUST_TABLE_ABI_DECLS
extern const cdoom_rust_FixedT finetangent[cdoom_rust_FINEANGLES / 2];
extern const cdoom_rust_FixedT finesine[5 * cdoom_rust_FINEANGLES / 4];
extern const cdoom_rust_AngleT tantoangle[cdoom_rust_SLOPERANGE + 1];
extern const uint8_t gammatable[cdoom_rust_GAMMATABLE_ROWS][cdoom_rust_GAMMATABLE_COLUMNS];
#endif
"""

[export]
prefix = "cdoom_rust_"

[export.rename]
"cdoom_rust_version" = "cdoom_rust_version"

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
